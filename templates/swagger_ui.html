<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Documentation - Lintas Asia Finance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/pwa/app-32.png">
  <style>
    body {
      margin: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .topbar {
      display: none !important;
    }
    .custom-header {
      background: #1e1b4b;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .custom-header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .custom-header a {
      color: #c7d2fe;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #4338ca;
      padding: 6px 14px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .custom-header a:hover {
      background: #4338ca;
      color: #fff;
    }
    .swagger-ui .info {
      margin: 24px 0 20px 0;
    }
    .swagger-ui .btn.authorize {
      background-color: #4f46e5;
      color: #fff;
      border-color: #4f46e5;
    }
    .swagger-ui .btn.authorize svg {
      fill: #fff;
    }
  </style>
</head>
<body>
  <div class="custom-header">
    <h1>
      📊 Lintas Asia Finance — External Payroll API
    </h1>
    <a href="/settings#external-api-config">⚙️ Kelola API Key</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "/api/v1/openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout",
        persistAuthorization: true
      });
    };
  </script>
</body>
</html>
